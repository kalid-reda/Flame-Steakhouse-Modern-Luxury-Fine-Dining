<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Table | Flame Steakhouse</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="scroll-progress"></div>

  <header>
    <nav class="navbar" id="navbar">
      <a href="index.html" class="nav-brand">FLAME<span>.</span></a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link" data-i18n="nav_home">Home</a></li>
        <li><a href="about.html" class="nav-link" data-i18n="nav_about">About</a></li>
        <li><a href="menu.html" class="nav-link" data-i18n="nav_menu">Menu</a></li>
        <li><a href="reservation.html" class="nav-link active" data-i18n="nav_reservation">Reservation</a></li>
        <li><a href="gallery.html" class="nav-link" data-i18n="nav_gallery">Gallery</a></li>
        <li><a href="contact.html" class="nav-link" data-i18n="nav_contact">Contact</a></li>
        <li><button id="lang-btn" class="lang-btn">العربية</button></li>
      </ul>
    </nav>
  </header>

  <main style="padding: 140px 5% 5rem; max-width: 800px; margin: 0 auto;">
    <div class="section-title">
      <h4 data-i18n="res_title">Table Reservation</h4>
      <h2 data-i18n="res_subtitle">Reserve Your Fine Dining Experience</h2>
    </div>

    <form class="glass-card" id="reservation-form">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1rem;">
        <div>
          <label style="color: var(--text-muted); font-size: 0.9rem;" data-i18n="lbl_name">Full Name</label>
          <input type="text" class="form-input" required>
        </div>
        <div>
          <label style="color: var(--text-muted); font-size: 0.9rem;" data-i18n="lbl_email">Email Address</label>
          <input type="email" class="form-input" required>
        </div>
        <div>
          <label style="color: var(--text-muted); font-size: 0.9rem;" data-i18n="lbl_phone">Phone Number</label>
          <input type="tel" class="form-input" required>
        </div>
        <div>
          <label style="color: var(--text-muted); font-size: 0.9rem;" data-i18n="lbl_date">Reservation Date</label>
          <input type="date" class="form-input" required style="color-scheme: dark;">
        </div>
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="color: var(--text-muted); font-size: 0.9rem;" data-i18n="lbl_notes">Special Requests</label>
        <textarea rows="4" class="form-input"></textarea>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;" data-i18n="btn_confirm">Confirm Reservation</button>
    </form>
  </main>

  <button id="back-to-top" aria-label="Back to top">↑</button>

  <footer>
    <div class="footer-bottom">
      <p>&copy; 2026 Flame Steakhouse. All Rights Reserved.
        <br><a href="https://www.facebook.com/share/1Lwmq1GfqW/" target="_blank">Developed by Codexa™</a>
      </p>
    </div>
  </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
