<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation | Flame Steakhouse</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/imgs/icon.png">
</head>
<body>

  <div id="scroll-progress"></div>

  <header>
    <nav class="navbar" id="navbar">
      <a href="index.html" class="nav-brand">FLAME<span>.</span></a>
      <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle Navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" class="nav-link" data-i18n="nav_home">Home</a></li>
        <li><a href="about.html" class="nav-link" data-i18n="nav_about">About</a></li>
        <li><a href="menu.html" class="nav-link" data-i18n="nav_menu">Menu</a></li>
        <li><a href="reservation.html" class="nav-link active" data-i18n="nav_reservation">Reservation</a></li>
        <li><a href="gallery.html" class="nav-link" data-i18n="nav_gallery">Gallery</a></li>
        <li><a href="contact.html" class="nav-link" data-i18n="nav_contact">Contact</a></li>
        <li><button id="lang-btn" class="lang-btn">العربية</button></li>
      </ul>
    </nav>
  </header>

  <main style="padding: 120px 5% 5rem; max-width: 700px; margin: 0 auto;">
    <div class="section-title">
      <h4 data-i18n="nav_reservation">BOOK A TABLE</h4>
      <h2>Reserve Your Fine Dining Experience</h2>
    </div>

    <form class="glass-card" id="reservation-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <div>
        <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem;">Full Name</label>
        <input type="text" class="form-input" required placeholder="John Doe">
      </div>
      
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
        <div>
          <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem;">Email</label>
          <input type="email" class="form-input" required placeholder="john@example.com">
        </div>
        <div>
          <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem;">Phone Number</label>
          <input type="tel" class="form-input" required placeholder="+1 (555) 000-0000">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem;">
        <div>
          <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem;">Guests</label>
          <select class="form-input" style="background: var(--card-bg);">
            <option>1 Person</option>
            <option selected>2 Persons</option>
            <option>4 Persons</option>
            <option>6+ Persons</option>
          </select>
        </div>
        <div>
          <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem;">Date</label>
          <input type="date" class="form-input" required>
        </div>
        <div>
          <label style="display: block; margin-bottom: 0.5rem; font-size: 0.875rem;">Time</label>
          <input type="time" class="form-input" required>
        </div>
      </div>

      <button type="submit" class="btn-primary" style="margin-top: 1rem; width: 100%; justify-content: center;" data-i18n="btn_book">Book Table</button>
    </form>
  </main>

  <footer>
    <div class="footer-bottom">
      <p>&copy; 2026 Flame Steakhouse. All Rights Reserved.
        <br><a href="https://www.facebook.com/share/1Lwmq1GfqW/" target="_blank">Developed by Codexa™</a>
      </p>
    </div>
  </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
