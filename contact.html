<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Flame Steakhouse</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="assets/imgs/icon.png">
</head>
<body>

  <div id="scroll-progress"></div>

  <header>
    <nav class="navbar" id="navbar">
      <a href="index.html" class="nav-brand">FLAME<span>.</span></a>
      <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle Navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" class="nav-link" data-i18n="nav_home">Home</a></li>
        <li><a href="about.html" class="nav-link" data-i18n="nav_about">About</a></li>
        <li><a href="contact.html" class="nav-link active" data-i18n="nav_contact">Contact</a></li>
        <li><button id="lang-btn" class="lang-btn">العربية</button></li>
      </ul>
    </nav>
  </header>

  <main style="padding: 120px 5% 5rem;">
    <div class="section-title">
      <h4 data-i18n="nav_contact">Contact Us</h4>
      <h2>Get In Touch</h2>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; max-width: 900px; margin: 0 auto;">
      <div class="glass-card">
        <h3 style="color: var(--secondary); margin-bottom: 1.5rem;">Information</h3>
        <p style="margin-bottom: 1rem;">📍 450 Fifth Avenue, New York, NY</p>
        <p style="margin-bottom: 1rem;">📞 +1 (212) 555-8901</p>
        <p style="margin-bottom: 1rem;">✉️ concierge@flamesteakhouse.com</p>
      </div>

      <form class="glass-card" id="contact-form" onsubmit="event.preventDefault(); showModal('Message Sent!', 'Thank you for reaching out to Flame Steakhouse.'); this.reset();">
        <input type="text" class="form-input" placeholder="Your Name" required style="margin-bottom: 1rem;">
        <input type="email" class="form-input" placeholder="Your Email" required style="margin-bottom: 1rem;">
        <textarea rows="4" class="form-input" placeholder="Your Message" style="margin-bottom: 1rem;"></textarea>
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Send Message</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-bottom">
      <p>&copy; 2026 Flame Steakhouse. All Rights Reserved.
        <br><a href="https://www.facebook.com/share/1Lwmq1GfqW/" target="_blank">Developed by Codexa™</a>
      </p>
    </div>
  </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
